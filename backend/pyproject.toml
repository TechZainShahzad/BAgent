[project]
name = "ba-platform"
version = "0.1.0"
description = "Agentic BA SDLC platform"
license = "Apache-2.0"
authors = [{ name = "Muhammad Zain Shahzad" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "python-docx>=1.2.0",
  "fastembed>=0.9.0",
  "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "numpy>=2.5.4",
]

[project.scripts]
ba = "app.cli.main:app"

[project.optional-dependencies]
capture = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "soundcard>=0.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "real_jira: hits real Jira (opt-in)",
  "real_teams: hits real Teams (opt-in)",
  "real_llm: calls the real Claude CLI (opt-in)",
  "real_embed: loads the real fastembed model (opt-in)",
]
addopts = "-m 'not real_jira and not real_teams and not real_llm and not real_embed'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.orchestration.*"]
strict = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "domain imports nothing outward"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.api", "app.cli", "app.services", "app.persistence", "app.integrations", "app.providers", "app.orchestration", "fastapi", "sqlalchemy", "httpx"]

[[tool.importlinter.contracts]]
name = "only jira integration talks to Jira"
type = "forbidden"
source_modules = ["app.api", "app.cli", "app.services", "app.agents", "app.orchestration", "app.domain", "app.persistence"]
forbidden_modules = ["app.integrations.jira.client"]
allow_indirect_imports = true

[[tool.mypy.overrides]]
module = ["app.integrations.jira.client"]
warn_return_any = false
